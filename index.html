<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>VanirLicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
:root{color-scheme:dark;--noche:#0d0916;--panel:#2e1f4a;--borde:#7c5bd6;--oro:#f2c14e;--marfil:#f3ecdc;--tenue:#b9a9d6;--rosa:#f06aa6;
  --titulo:"Pixelify Sans","Courier New",monospace;--texto:"VT323","Courier New",monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at center,#2a1a4a,var(--noche) 70%);color:var(--marfil);font:21px/1.25 var(--texto);display:flex;align-items:center;justify-content:center;padding:16px}
form{width:min(100%,420px);background:var(--panel);border:3px solid var(--noche);box-shadow:inset 0 0 0 2px var(--borde),inset 0 -5px 0 2px #1a1030,0 4px 0 #0008;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
h1{margin:0;font:700 44px/1 var(--titulo);text-shadow:0 4px 0 #4b2f96}
h1 i{font-style:normal;color:var(--oro)}
p{margin:0;color:var(--tenue)}
input{width:100%;font:22px var(--texto);color:var(--marfil);background:#0b0714;border:2px solid var(--borde);padding:9px 11px}
input:focus-visible,button:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
button{font:500 20px var(--titulo);color:#2a1800;background:var(--oro);border:2px solid #fff1bf;box-shadow:inset 0 -3px 0 #b5852a;padding:9px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#error{min-height:1.3em;color:var(--rosa)}
</style>
</head>
<body>
<form id="f">
  <h1>Vanir<i>Licht</i></h1>
  <p>Este mundo aún es privado.</p>
  <label for="clave">Contraseña</label>
  <input id="clave" type="password" autocomplete="current-password" autofocus required>
  <button id="b" type="submit">Entrar al mundo</button>
  <div id="error" role="alert"></div>
</form>
